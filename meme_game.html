<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Meme Game</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            height: 100vh;\n            background-color: #f0f0f0;\n            margin: 0;\n        }\n        #game {\n            background: white;\n            border: 2px solid #ccc;\n            border-radius: 10px;\n            box-shadow: 2px 2px 12px rgba(0, 0, 0, 0.1);\n            padding: 20px;\n            max-width: 600px;\n            width: 100%;\n            text-align: center;\n        }\n        h1 {\n            color: #333;\n        }\n        #score {\n            font-size: 24px;\n            margin: 10px 0;\n        }\n        button {\n            padding: 10px 20px;\n            font-size: 16px;\n            background-color: #007bff;\n            color: white;\n            border: none;\n            border-radius: 5px;\n            cursor: pointer;\n            transition: background 0.3s;\n        }\n        button:hover {\n            background-color: #0056b3;\n        }\n        .animation {\n            transition: transform 0.5s;\n        }\n        .animation:active {\n            transform: scale(0.9);\n        }\n    </style>\n</head>\n<body>\n    <div id="game">\n        <h1>Meme Game</h1>\n        <div id="score">Score: <span id="scoreValue">0</span></div>\n        <button id="startGame">Start Game</button>\n        <div id="level">Level: <span id="levelValue">1</span></div>\n        <div id="gameArea">\n            <!-- Meme images will be dynamically added here -->\n        </div>\n    </div>\n    <script>\n        let score = 0;\n        let level = 1;\n        const scoreValue = document.getElementById('scoreValue');\n        const levelValue = document.getElementById('levelValue');\n        const gameArea = document.getElementById('gameArea');\n        const startGameButton = document.getElementById('startGame');\n\n        startGameButton.addEventListener('click', startGame);\n\n        function startGame() {\n            score = 0;\n            level = 1;\n            scoreValue.textContent = score;\n            levelValue.textContent = level;\n            gameArea.innerHTML = '';\n            addMeme();\n        }\n\n        function addMeme() {\n            // Create a new meme image element (placeholder for now)\n            const meme = document.createElement('img');\n            meme.src = 'https://via.placeholder.com/150'; // Change to actual meme source\n            meme.alt = 'Meme';\n            meme.style.width = '100%';\n            meme.style.cursor = 'pointer';\n            meme.classList.add('animation');\n            meme.addEventListener('click', () => {\n                score++;\n                updateScore();\n                meme.remove();\n                if (score % 5 === 0) {\n                    levelUp();\n                } else {\n                    addMeme();\n                }\n            });\n            gameArea.appendChild(meme);\n        }\n\n        function updateScore() {\n            scoreValue.textContent = score;\n        }\n\n        function levelUp() {\n            level++;\n            levelValue.textContent = level;\n            addMeme(); // Add new meme for the next level\n        }\n    </script>\n</body>\n</html>\n
